[workspace]
resolver = "2"
members = ["crates/nmux-core", "crates/nmux-proto", "crates/nmux-server", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Nathan Collins"]
repository = "https://github.com/Nam-Antoine/Nmux"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
anyhow = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
