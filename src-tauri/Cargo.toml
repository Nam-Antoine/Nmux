[package]
name = "nmux"
description = "Nmux desktop window: a thin shell over nmux-server."
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nmux-proto = { path = "../crates/nmux-proto" }
nmux-server = { path = "../crates/nmux-server" }
# custom-protocol: serve the built UI from inside the binary (there is no dev server).
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
