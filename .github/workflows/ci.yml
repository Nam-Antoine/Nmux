name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Electron's binary is downloaded by its postinstall; make sure it is there
      # (pnpm 10 only runs the scripts allow-listed in package.json).
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Package (unpacked, no installer)
        run: pnpm exec electron-builder --win --dir --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: nmux-win-unpacked
          path: release/win-unpacked
          retention-days: 7
