[package]
name = "nmux-server"
description = "The Nmux background server: owns the terminals so they outlive the window."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nmux_server"
path = "src/lib.rs"

[[bin]]
name = "nmux-server"
path = "src/main.rs"

[dependencies]
nmux-core = { path = "../nmux-core" }
nmux-proto = { path = "../nmux-proto" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
portable-pty = "0.9"
vt100 = "0.16"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.3"
base64 = "0.22"
trash = "5"
tar = { version = "0.4", default-features = false }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
